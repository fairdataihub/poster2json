name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    if: (!(github.event.action == 'closed' && github.event.pull_request.merged != true))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Poetry
        uses: Gr1N/setup-poetry@v8

      - name: Install dependencies
        run: poetry install

      - name: Setup poetry config
        run: poetry config pypi-token.pypi "${{ secrets.PYPI_API_TOKEN }}"

      - name: Wait for CI to pass
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: main
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-name: "ci"

      - name: Build package
        run: poetry build

      - name: Publish package
        run: poetry publish

      - name: Trigger posters-science-extraction-api redeploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.EXTRACTION_API_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fairdataihub/posters-science-extraction-api/dispatches \
            -d '{"event_type":"poster2json-published"}'
