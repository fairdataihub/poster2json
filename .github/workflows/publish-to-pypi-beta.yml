name: Publish to PyPI - beta tags

on:
  release:
    types: [published]
  push:
    branches:
      - staging
  pull_request:
    types: [closed]
    branches:
      - staging
  workflow_dispatch:

jobs:
  release:
    if: (!(github.event.action == 'closed' && github.event.pull_request.merged != true))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Poetry
        uses: Gr1N/setup-poetry@v8

      - name: Install dependencies
        run: poetry install

      - name: Setup poetry config
        run: poetry config pypi-token.pypi "${{ secrets.PYPI_API_TOKEN }}"

      - name: Build package
        run: poetry build

      - name: Check whether this version is already on PyPI
        id: version_check
        run: |
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sfI "https://pypi.org/pypi/poster2json/$VERSION/json" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "poster2json $VERSION is already published; skipping upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.version_check.outputs.exists == 'false'
        run: poetry publish
