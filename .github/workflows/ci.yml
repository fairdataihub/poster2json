name: ci

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # Pin to the version the publish workflows use. ubuntu-latest now ships
      # Python 3.14, which some locked dependencies have no wheels for yet.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: Gr1N/setup-poetry@v8

      - name: Change executable permissions for files in the bin folder
        run: chmod +x ./bin/*

      - name: Check dependencies
        run: make doctor

      - uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: make install

      # - name: Check code
      #   run: make check

      - name: Test code
        run: make test