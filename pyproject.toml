[tool.poetry]

name = "poster2json"
version = "0.9.13"
description = "Convert scientific posters (PDF/images) to structured JSON metadata using Large Language Models"

packages = [{ include = "poster2json" }]

license = "MIT"
authors = [
    "FAIR Data Innovations Hub <contact@fairdataihub.org>",
    "James O'Neill <joneill@calmi2.org>",
    "Sanjay Soundarajan <ssoundarajan@calmi2.org>",
    "Bhavesh Patel <bpatel@calmi2.org>",
]

readme = "README.md"
homepage = "https://github.com/fairdataihub/poster2json"
documentation = "https://fairdataihub.github.io/poster2json"
repository = "https://github.com/fairdataihub/poster2json"

keywords = [
    "poster",
    "json",
    "metadata",
    "extraction",
    "llm",
    "scientific",
    "pdf",
    "ocr",
    "machine-learning",
    "datacite",
    "fair-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]

[tool.poetry.dependencies]

python = "^3.10"
click = "^8.0"

# ML/AI dependencies
torch = ">=2.0.0"
transformers = ">=4.40.0"
accelerate = ">=0.20.0"
bitsandbytes = ">=0.44.0"
safetensors = "*"
sentencepiece = "*"

# PDF/Image processing
# pdfplumber is the primary layout-aware PDF text extractor (MIT-licensed,
# replaced pdfalto). pymupdf is the secondary fallback.
pdfplumber = ">=0.10.0"
pymupdf = ">=1.22.0"
Pillow = ">=9.0.0"

# Validation / JSON repair
jsonschema = ">=4.17.0"
json-repair = ">=0.30.0"
rouge-score = "*"
numpy = "*"

# Language detection (heuristic, no LLM).
# Pinned to ~2.1 because 2.2.0 dropped Python 3.10/3.11 support and we
# still target ^3.10. Revisit when poster2json bumps its Python floor.
lingua-language-detector = ">=2.1,<2.2"

# CLI/Utilities
art = "^6.0"

[tool.poetry.extras]
# Vision OCR for image posters (optional, requires more GPU memory)
vision = ["qwen-vl-utils"]

[tool.poetry.group.dev.dependencies]

# Formatters
black = "^26.3"
tomli = "*"
isort = "^5.10"

# Linters
mypy = "^1.0"
pydocstyle = "^6.1"
pylint = "~2.15"
wrapt = "*"

# Testing
pytest = "^7.1"
pytest-describe = "^2.0"
pytest-cov = "^3.0"

# Documentation
mkdocs = "~1.3"
pygments = "^2.11.1"

# Tooling
poethepoet = "^0.20.0"

[tool.poetry.scripts]

poster2json = "poster2json.cli:main"

[tool.poe.tasks]

docs = "mkdocs serve"
format_with_isort = "isort poster2json tests"
format_with_black = "black poster2json tests"
format = ["format_with_isort", "format_with_black"]
typecheck = "mypy poster2json tests"
pylint = "pylint poster2json tests --rcfile=.pylint.ini"
precommit = ["format", "typecheck", "pylint"]
test = "pytest -rx -W ignore::DeprecationWarning"

[tool.black]
quiet = true
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
cache_dir = ".cache/mypy/"

[tool.pytest.ini_options]
addopts = "-r sxX --show-capture=log --cov=poster2json --cov-report=term-missing:skip-covered --no-cov-on-fail"
cache_dir = ".cache/pytest/"
markers = ["gpu: mark test as requiring a GPU (skip in CI with -m 'not gpu')"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
